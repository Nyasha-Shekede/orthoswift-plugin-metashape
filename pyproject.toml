[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthoswift-plugin-metashape"
version = "1.0.0"
description = "OrthoSWIFT plugin for Agisoft Metashape Professional"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OrthoSWIFT", email = "info@orthoswift.net"}
]
keywords = ["orthoswift", "metashape", "agisoft", "photogrammetry", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy>=1.13,<1.16",
    "rasterio>=1.4,<1.5",
    "shapely>=2.0,<2.2",
    "geopandas>=1.0,<1.2",
    "scikit-learn>=1.5,<1.8",
    "reportlab>=4.2,<5",
    "matplotlib>=3.8,<3.11",
    "pandas>=2.2,<2.4",
    "affine>=2.4,<3",
    "pyproj>=3.6,<3.8",
]

[project.urls]
Homepage = "https://orthoswift.net"
Repository = "https://github.com/Nyasha-Shekede/orthoswift-plugin-metashape"
Issues = "https://github.com/Nyasha-Shekede/orthoswift-plugin-metashape/issues"

[tool.setuptools]
packages = ["orthoswift", "orthoswift.core"]

[tool.setuptools.package-data]
orthoswift = ["requirements.txt", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
